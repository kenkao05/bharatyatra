<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!--
    ============================================================
    SERVER-SIDE HEADERS — configure in Vercel vercel.json or
    Apache/Nginx alongside these meta equivalents:
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      X-XSS-Protection: 1; mode=block
      Referrer-Policy: strict-origin-when-cross-origin
      Permissions-Policy: geolocation=(), microphone=(), camera=()
      Strict-Transport-Security: max-age=31536000; includeSubDomains
    ============================================================
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
                 font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
                 img-src 'self' data: https:;
                 connect-src 'self' https://gtpnojbbamoaznlutxap.supabase.co;
                 frame-ancestors 'none';
                 base-uri 'none';
                 form-action 'self';
                 object-src 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <title>Admin Login | BharatYatra</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qALmWA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"/>
  <script src="https://unpkg.com/@supabase/supabase-js@2"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
  <!-- Security: load auth module immediately after supabase -->
  <script src="admin-auth.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg:       #071021;
      --card:     #0b1220;
      --border:   rgba(255,255,255,0.07);
      --cyan:     #06b6d4;
      --cyan-dim: rgba(6,182,212,0.12);
      --muted:    #94a3b8;
      --white:    #e8f0f7;
      --red:      #ef4444;
      --red-dim:  rgba(239,68,68,0.12);
      --radius:   14px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Background grid pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(6,182,212,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6,182,212,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      display: block;
      margin-bottom: 8px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Card */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow:
        0 24px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(6,182,212,0.06),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px 12px 42px;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s;
    }

    .form-input::placeholder { color: rgba(148,163,184,0.5); }

    .form-input:focus {
      border-color: var(--cyan);
      background: rgba(6,182,212,0.05);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.12);
    }

    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--cyan);
    }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--cyan); }

    /* Error message */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
    }
    .error-msg.show { display: flex; }
    .error-msg i { color: var(--red); font-size: 14px; flex-shrink: 0; }

    /* Submit button */
    .btn-login {
      width: 100%;
      background: var(--cyan);
      color: #071021;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }
    .btn-login:hover:not(:disabled) {
      background: #22d3ee;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(6,182,212,0.3);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-login .spinner {
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }

    /* Keep button looking active while Supabase responds */
    .btn-login.loading {
      background: #0e7490;
      color: #e8f0f7;
    }

    /* ── SUCCESS STATE — animated progress bar ── */
    .btn-login.success {
      position: relative;
      overflow: hidden;
      cursor: not-allowed;
      background: #0e7490;
      color: transparent;
    }
    .btn-login.success .btn-text,
    .btn-login.success .spinner { display: none !important; }

    /* Solid fill that grows left→right */
    .btn-login.success::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #06b6d4;
      transform-origin: left center;
      transform: scaleX(0);
      animation: progressFill 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Shimmer sweep on top */
    .btn-login.success::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.25) 50%,
        transparent 100%
      );
      animation: progressSweep 0.7s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes progressFill {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    @keyframes progressSweep {
      from { left: -60%; }
      to   { left: 110%; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer note */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--cyan);
      text-decoration: none;
    }
    .login-footer a:hover { text-decoration: underline; }

    /* ==================== CUSTOM CURSOR ==================== */
    @media (pointer: fine) {
      *, *::before, *::after { cursor: none !important; }

      .cursor-dot {
        position: fixed;
        top: 0; left: 0;
        width: 10px; height: 10px;
        border-radius: 50%;
        background: rgba(99, 179, 237, 0.95);
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        will-change: transform;
        box-shadow:
          0 0 6px 2px  rgba(99, 179, 237, 0.8),
          0 0 18px 6px rgba(99, 179, 237, 0.35),
          0 0 36px 10px rgba(147, 197, 253, 0.15);
        transition: width 0.15s ease, height 0.15s ease, box-shadow 0.15s ease;
      }

      .cursor-dot.hovering {
        width: 14px; height: 14px;
        box-shadow:
          0 0 10px 4px  rgba(99, 179, 237, 1),
          0 0 28px 10px rgba(99, 179, 237, 0.5),
          0 0 55px 18px rgba(147, 197, 253, 0.25);
      }

      .cursor-particle {
        position: fixed;
        top: 0; left: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 99998;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrap">

    <div class="brand">
      <span class="brand-logo">Bharat Yatra</span>
      <span class="brand-sub">Admin Panel</span>
    </div>

    <div class="login-card">
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to access the content manager.</div>

      <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Invalid email or password.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="email"
            id="email"
            placeholder="admin@bharatyatra.in"
            autocomplete="email"
            maxlength="254"
            spellcheck="false"
          />
          <i class="fas fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            maxlength="128"
          />
          <i class="fas fa-lock input-icon"></i>
          <button class="pw-toggle" type="button" id="pwToggle" tabindex="-1">
            <i class="fas fa-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn-login" id="loginBtn">
        <i class="fas fa-circle-notch spinner"></i>
        <span class="btn-text"><i class="fas fa-arrow-right"></i> Sign In</span>
      </button>
    </div>

    <div class="login-footer">
      <a href="../index.html">← Back to BharatYatra</a>
    </div>

  </div>

  <script>
    // sb and BYRateLimit are initialised by admin-auth.js

    // ── ?r= REASON PARAM — safe display only ─────────────────────────────────
    // Read the redirect reason from the URL param, validate against an allowlist,
    // and display a contextual message. Never reflect the raw value into innerHTML.
    const REASON_MESSAGES = Object.freeze({
      'inactivity':     'You were logged out due to inactivity.',
      'token_expired':  'Your session expired. Please sign in again.',
      'session_expired':'Your session expired. Please sign in again.',
      'integrity_fail': 'A security check failed. Please sign in again.',
      'no_session':     ''
    });

    (function showReasonBanner() {
      const params = new URLSearchParams(window.location.search);
      const reason = params.get('r') || '';
      const msg = REASON_MESSAGES[reason] || '';
      if (msg) {
        const el = document.getElementById('errorMsg');
        document.getElementById('errorText').textContent = msg;
        el.classList.add('show');
      }
    })();

    // ── LOCKOUT UI HELPERS ───────────────────────────────────────────────────
    let lockoutInterval = null;

    function clearLockoutInterval() {
      clearInterval(lockoutInterval);
      lockoutInterval = null;
    }

    function showLockout(secondsRemaining) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      clearLockoutInterval();

      lockoutInterval = setInterval(() => {
        const st = BYRateLimit.status();
        if (!st.locked) {
          clearLockoutInterval();
          btn.classList.remove('loading');
          btn.disabled = false;
          showError('You can try again now.');
          return;
        }
        const m = Math.floor(st.remaining / 60);
        const s = st.remaining % 60;
        showError(`Too many failed attempts. Try again in ${m}:${String(s).padStart(2,'0')}.`);
      }, 1000);

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      showError(`Too many failed attempts. Try again in ${m}:${String(s).padStart(2,'0')}.`);
    }

    // ── INIT ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      // Check lockout on load
      const st = BYRateLimit.status();
      if (st.locked) {
        showLockout(st.remaining);
        document.getElementById('loginBtn').disabled = true;
      }

      // Login button — event listener, not inline onclick
      document.getElementById('loginBtn').addEventListener('click', handleLogin);

      // Password visibility toggle
      document.getElementById('pwToggle').addEventListener('click', () => {
        const input = document.getElementById('password');
        const icon  = document.getElementById('pwIcon');
        const show  = input.type === 'password';
        input.type     = show ? 'text' : 'password';
        icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
      });

      // Enter key support — debounced to prevent rapid-fire calls bypassing rate limiter
      let enterDebounce = null;
      document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          clearTimeout(enterDebounce);
          enterDebounce = setTimeout(handleLogin, 100);
        }
      });
      document.getElementById('email').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('password').focus();
      });
    });

    function showError(msg) {
      // All output via textContent — never innerHTML — prevents reflected XSS
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    // ── INPUT SANITISATION ───────────────────────────────────────────────────
    // Strips characters that have no place in an email address.
    // Passwords are passed raw (they may legitimately contain special chars).
    function sanitiseEmail(str) {
      return str.replace(/[<>"'`]/g, '').trim();
    }

    // ── LOGIN HANDLER ────────────────────────────────────────────────────────
    let loginInFlight = false;  // guard against double-submit

    async function handleLogin() {
      if (loginInFlight) return;
      hideError();

      const st = BYRateLimit.status();
      if (st.locked) { showLockout(st.remaining); return; }

      const emailRaw = document.getElementById('email').value.trim();
      const pwRaw    = document.getElementById('password').value;

      if (!emailRaw || !pwRaw) {
        showError('Please enter your email and password.');
        return;
      }

      // Enforce client-side length caps (defence-in-depth alongside maxlength attrs)
      if (emailRaw.length > 254 || pwRaw.length > 128) {
        showError('Invalid credentials.');
        return;
      }

      const email = sanitiseEmail(emailRaw);

      if (!/^[^\s@]{1,64}@[^\s@]{1,253}\.[a-zA-Z]{2,}$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }

      if (pwRaw.length < 6) {
        showError('Invalid credentials.');
        return;
      }

      const btn = document.getElementById('loginBtn');
      btn.classList.add('loading');
      btn.disabled = true;
      loginInFlight = true;

      try {
        const { error } = await sb.auth.signInWithPassword({ email, password: pwRaw });

        if (error) {
          const status = BYRateLimit.recordFail();
          if (status.locked) {
            showLockout(status.remaining);
          } else {
            showError(
              `Invalid credentials. ${status.attemptsLeft} attempt${status.attemptsLeft !== 1 ? 's' : ''} remaining.`
            );
            btn.classList.remove('loading');
            btn.disabled = false;
          }
          return;
        }

        // Success — clear lockout interval before redirecting
        clearLockoutInterval();
        BYRateLimit.reset();
        sessionStorage.removeItem('by_admin_uid');

        // Switch to success/progress-bar state.
        // Two rAF calls guarantee the browser has painted the new class
        // before navigation fires — otherwise the CSS never renders.
        btn.classList.remove('loading');
        btn.classList.add('success');

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => {
              window.location.replace('admin-dashboard.html');
            }, 1200);
          });
        });

      } catch (err) {
        showError('A network error occurred. Please try again.');
        btn.classList.remove('loading');
        btn.disabled = false;
      } finally {
        loginInFlight = false;
      }
    }
  </script>

  <!-- ==================== CUSTOM CURSOR ==================== -->
  <div class="cursor-dot" id="cursorDot"></div>

  <script>
  (function () {
    if (!window.matchMedia('(pointer: fine)').matches) return;

    const dot = document.getElementById('cursorDot');
    let mouseX = -200, mouseY = -200;
    let prevX = -200, prevY = -200;

    // ── Particle pool ───────────────────────────────────────────────
    const POOL_SIZE = 28;
    const pool = Array.from({ length: POOL_SIZE }, () => {
      const el = document.createElement('div');
      el.className = 'cursor-particle';
      el.style.opacity = '0';
      document.body.appendChild(el);
      return {
        el,
        active: false,
        x: 0, y: 0,
        vx: 0, vy: 0,
        life: 0, maxLife: 0,
        size: 0,
      };
    });

    function getParticle() {
      return pool.find(p => !p.active) || pool[0];
    }

    function spawnParticle(x, y, speedX, speedY) {
      const p = getParticle();
      p.active  = true;
      p.x       = x;
      p.y       = y;
      // Base velocity from cursor movement + random scatter
      p.vx      = speedX * 0.25 + (Math.random() - 0.5) * 1.8;
      p.vy      = speedY * 0.25 + (Math.random() - 0.5) * 1.8;
      p.size    = 2 + Math.random() * 2.5;
      p.maxLife = 28 + Math.random() * 22;
      p.life    = p.maxLife;
      // Vary between blue and cyan-indigo
      const hue = 200 + Math.random() * 40;
      p.el.style.width  = p.size + 'px';
      p.el.style.height = p.size + 'px';
      p.el.style.background = `hsl(${hue}, 90%, 72%)`;
      p.el.style.boxShadow  = `0 0 ${p.size * 2}px hsl(${hue}, 90%, 72%)`;
    }

    // ── Mouse tracking ───────────────────────────────────────────────
    document.addEventListener('mousemove', (e) => {
      prevX   = mouseX;
      prevY   = mouseY;
      mouseX  = e.clientX;
      mouseY  = e.clientY;

      // Spawn particles proportional to movement speed
      const dx    = mouseX - prevX;
      const dy    = mouseY - prevY;
      const speed = Math.sqrt(dx * dx + dy * dy);
      const count = Math.min(Math.floor(speed * 0.4), 4);
      for (let i = 0; i < count; i++) spawnParticle(mouseX, mouseY, dx, dy);
    });

    // ── Hover expand ─────────────────────────────────────────────────
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('a, button, input, label')) dot.classList.add('hovering');
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest('a, button, input, label')) dot.classList.remove('hovering');
    });

    document.addEventListener('mouseleave', () => { dot.style.opacity = '0'; });
    document.addEventListener('mouseenter', () => { dot.style.opacity = '1'; });

    // ── Animation loop ───────────────────────────────────────────────
    function animate() {
      // Snap dot to cursor
      dot.style.left = mouseX + 'px';
      dot.style.top  = mouseY + 'px';

      // Update particles
      pool.forEach(p => {
        if (!p.active) return;
        p.life--;
        if (p.life <= 0) {
          p.active = false;
          p.el.style.opacity = '0';
          return;
        }
        // Drift and decelerate
        p.vx *= 0.91;
        p.vy *= 0.91;
        p.x  += p.vx;
        p.y  += p.vy;

        const progress = p.life / p.maxLife;     // 1→0 as particle dies
        const opacity  = progress * 0.75;
        const scale    = 0.4 + progress * 0.6;   // shrinks as it fades

        p.el.style.left      = p.x + 'px';
        p.el.style.top       = p.y + 'px';
        p.el.style.opacity   = opacity.toFixed(3);
        p.el.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
      });

      requestAnimationFrame(animate);
    }

    animate();
  })();
  </script>
</body>
</html>
